<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}"><title>OrderBot 首次设置</title>
<style>body{font:14px/1.7 'Microsoft YaHei',sans-serif;background:#f4f6fa;color:#26364d;margin:0}main{max-width:820px;margin:32px auto;padding:28px;background:white;border-radius:14px}h1{font-size:24px;margin:0}p{color:#6b7788}fieldset{border:1px solid #e4e9f0;border-radius:8px;margin:20px 0;padding:18px}legend{font-weight:bold}label{display:block;margin:10px 0}input,textarea{display:block;box-sizing:border-box;width:100%;padding:9px;border:1px solid #ccd6e2;border-radius:6px;font:inherit}button{padding:10px 18px;background:#3370ff;color:white;border:0;border-radius:7px;cursor:pointer}button.secondary{background:#edf2f8;color:#38506d}#status{white-space:pre-wrap}small{color:#71819a}</style></head><body><main>
<h1>欢迎使用 OrderBot</h1><p>填写你自己的账号。程序不会携带开发电脑的密钥、聊天数据或代理设置。完成后先检查测试目标，再手动启用发送。</p>
{% if configured %}<p>已存在客户配置，本向导不会覆盖。请重新打开主程序，在管理后台修改。</p>{% else %}
<form id="setupForm"><fieldset><legend>企业微信会话存档</legend>
<label>企业 ID<input name="corpid" required autocomplete="off"></label><label>会话存档 Secret<input name="archive_secret" type="password" required autocomplete="new-password"></label>
<label>私钥版本<input name="private_key_version" value="1" inputmode="numeric" required></label><label>账号自己的 RSA 私钥（PEM）<textarea name="private_key" rows="5" required autocomplete="off"></textarea></label></fieldset>
<fieldset><legend>飞书测试目标</legend><label>应用 App ID<input name="feishu_app_id" required></label><label>App Secret<input name="feishu_app_secret" type="password" required autocomplete="new-password"></label><label>测试文件夹 token<input name="folder_token" required></label><label>测试群 chat_id<input name="chat_id" required></label><small>首次只配置测试目标；安装完成不会自动给群发单。</small></fieldset>
<fieldset><legend>DeepSeek（与订单整理共用）</legend><label>接口地址<input name="deepseek_base_url" value="https://api.deepseek.com" required></label><label>API Key<input name="deepseek_api_key" type="password" required autocomplete="new-password"></label><label>模型<input name="deepseek_model" value="deepseek-chat" required></label></fieldset>
<fieldset><legend>本机管理后台</legend><label>设置密码（至少8位）<input name="admin_password" type="password" minlength="8" required autocomplete="new-password"></label></fieldset>
<button id="check" type="button" class="secondary">检查连接一次</button> <button type="submit">保存配置，保持发送关闭</button>
</form>{% endif %}<p id="status" role="status" aria-live="polite"></p><small>充值由账号所有人完成。企微可信 IP：企业微信后台 → 管理工具 → 会话内容存档 → 可信 IP。运行后可在诊断师查看逐步指引。</small>
<script>const form=document.getElementById('setupForm');let busy=false;async function submit(kind){if(busy||!form.reportValidity())return;busy=true;const state=document.getElementById('status');state.textContent='正在处理，请稍候…';const data=Object.fromEntries(new FormData(form));data.request_id=crypto.randomUUID();try{const r=await fetch('/api/setup/'+kind,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':document.querySelector('meta[name="csrf-token"]').content},body:JSON.stringify(data)});const outcome=await r.json();state.textContent=outcome.error||outcome.message||'请求已结束';if(outcome.checks)state.textContent+='\n'+Object.entries(outcome.checks).map(([name,v])=>name+'：'+(v.ok?'已连接':'待处理')+' '+(v.message||'')).join('\n');if(kind==='save'&&outcome.ok)form.hidden=true;}catch(e){state.textContent='结果尚未确认，请重新打开查看已保存配置；不要反复点击。';}finally{busy=false;}}if(form){form.addEventListener('submit',e=>{e.preventDefault();submit('save')});document.getElementById('check').addEventListener('click',()=>submit('check'));}</script></main></body></html>
