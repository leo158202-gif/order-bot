<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>order-bot 订单自动整理</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f7; }
  .target-banner { background: #fff3cd; color: #856404; text-align: center;
                   padding: 4px; font-size: 13px; }
  .ip-banner { background: #f8d7da; color: #721c24; padding: 10px 20px; font-size: 14px;
               display: none; }
  .ip-banner.show { display: flex; align-items: center; gap: 12px; }
  .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
  .actions { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: 15px;
         cursor: pointer; background: #3370ff; color: #fff; }
  .btn.secondary { background: #fff; color: #333; border: 1px solid #ddd; }
  .btn.off { background: #f0f0f0; color: #888; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 8px; padding: 14px;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card .label { font-size: 12px; color: #999; }
  .card .value { font-size: 20px; font-weight: bold; margin-top: 4px; }
  .value.ok { color: #1a7f37; } .value.bad { color: #d32f2f; }
  .card .mini { font-size: 11px; color: #bbb; margin-top: 2px; }
  .logbox { background: #1e1e1e; color: #d4d4d4; border-radius: 8px; padding: 14px;
            height: 320px; overflow-y: auto; font-family: Consolas, monospace;
            font-size: 12px; line-height: 1.7; white-space: pre-wrap; }
  button.small { padding: 2px 8px; font-size: 12px; }
</style>
</head>
<body>
{% if target == 'test' %}
<div class="target-banner">当前为【测试】模式：写测试文件夹、发测试群</div>
{% endif %}
<div class="ip-banner" id="ipBanner">
  <span>⚠ 企业微信因可信 IP 拒绝了拉取（当前公网 IP：<b id="ipNew"></b>）。请到管理后台更新可信 IP，完成后点「我已更新」。</span>
  <button class="small" onclick="copyIp()">复制 IP</button>
</div>
<div class="container">
  <div class="actions">
    <button class="btn" onclick="manualBatch()">现在输出临时订单</button>
    <button class="btn secondary" id="scheduleBtn" onclick="toggleSchedule()">定时发送</button>
    <button class="btn secondary" onclick="location.href='{{ admin_url }}'">管理后台</button>
  </div>
  <div class="cards" id="cards"></div>
  <div class="logbox" id="logs"></div>
</div>
<script>
async function refresh() {
  const s = await (await fetch('/api/status')).json();
  const card = (label, value, cls='', mini='') =>
    `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="mini">${mini}</div></div>`;
  let ipCard;
  if (!s.network_ok) ipCard = card('公网 IP', '网络断开', 'bad');
  else if (s.ip_ok === true) ipCard = card('公网 IP', s.ip, 'ok', '已登记');
  else if (s.ip_ok === false) ipCard = card('公网 IP', s.ip, 'bad', '需更新可信 IP');
  else ipCard = card('公网 IP', '检测中');
  const reviewDetail = Number.isInteger(s.pending_messages)
    ? `订单 ${s.pending_orders} · 失败消息 ${s.pending_messages}` +
      (s.pending_unknown ? ` · 异常记录 ${s.pending_unknown}` : '')
    : '订单记录；失败消息待核实';
  document.getElementById('cards').innerHTML =
    ipCard +
    card('上次拉取', s.last_pull) +
    card('今天消息', s.today_msgs) +
    card('未整理', s.unbatched) +
    card('待核（全部记录）', s.pending, '', reviewDetail) +
    card('定时', s.next_run, '', s.master_on ? '已开启' : '已关闭');
  document.getElementById('ipBanner').classList.toggle('show', s.ip_ok === false);
  if (s.ip) document.getElementById('ipNew').textContent = s.ip;
  const btn = document.getElementById('scheduleBtn');
  btn.textContent = (s.master_on ? '定时发送 开' : '定时发送 关') + '（' + s.next_run + '）';
  btn.classList.toggle('off', !s.master_on);
}
async function manualBatch() {
  const clickId = crypto.randomUUID();
  // 一次点击的网络重试沿用同一标识，下一次点击生成新标识。
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const response = await fetch('/api/batch/manual', {
        method: 'POST', headers: {'Idempotency-Key': clickId}
      });
      if (!response.ok) throw new Error('请求未完成');
      const r = await response.json();
      if (!r.ok) alert(r.msg);
      return;
    } catch (error) {
      if (attempt === 1) alert('发送请求未确认，请稍后查看日志。');
    }
  }
}
async function toggleSchedule() {
  await fetch('/api/schedule/toggle', {method:'POST'});
  refresh();
}
function copyIp() {
  navigator.clipboard.writeText(document.getElementById('ipNew').textContent);
}
// SSE 实时日志
const logs = document.getElementById('logs');
const es = new EventSource('/api/logs/stream');
es.onmessage = (e) => {
  logs.textContent += e.data + '\n';
  logs.scrollTop = logs.scrollHeight;
};
refresh();
// 状态轮询：10 秒；页面隐藏（最小化/切后台）时暂停，减轻嵌入 webview 负担（#0b）
let refreshTimer = setInterval(refresh, 10000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(refreshTimer);
  } else {
    refresh();
    refreshTimer = setInterval(refresh, 10000);
  }
});
</script>
</body>
</html>
