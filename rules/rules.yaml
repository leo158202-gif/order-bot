    - { short: "灯槽款", b: "40*40{颜色}铝合金卡槽扶手 灯槽款", c: "槽口16 X支X米", note: "原文有“新”加新款前缀，如 新款40*40黑色铝合金卡槽扶手灯槽款" }
    - { short: "新款30x30黑色", b: "新款30*30黑色铝合金卡槽扶手 厚款", c: "【厚度】X支X米" }
