    - { short: "36*88 扶手", b: "36*88{颜色}铝合金扶手", c: "X支X米", note: "配摇头立柱" }
    - { short: "40*60 扶手", b: "40*60{颜色}铝合金扶手", c: "X支X米", note: "配 H 头立柱" }
    - { short: "40*80 扶手", b: "40*80{颜色}铝合金扶手", c: "X支X米", note: "配免扶手/无头" }
