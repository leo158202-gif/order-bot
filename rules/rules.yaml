# ---------- 8. 自动补算（用户没写时才补；用户写了以用户为准） ----------
auto_calc:
  # 已用 9 月订单验证：9.1 第3单 12支无头+8靠墙 → 膨胀64、钻尾80 ✓
  expansion_screw:
    name: "膨胀螺丝"
    formula: "(post_count + ceil(wall_count / 2)) * 4"
    notes: "四方大柱也算立柱；wall_count含靠墙封口及36*88靠墙盖子+固定件；靠墙盖子不抵扣立柱盖子（10.21序43）"
  drill_screw:
    name: "小号钻尾螺丝"
    formula: "post_count + wall_count"
    catalog_post_styles: [h, wutou, fushou]
    catalog_per_point: 4
    exclude_styles: [mianfushou, pingtou, erduo]
    notes: "老板表优先：内卡槽无头/H款每点4个，点数=立柱+靠墙（10.20序36、10.21序5/43、10.22序9及多日样例）。免扶手/平头/耳朵款不自动配钻尾；显式数量保留。混大柱及未知款式不套目录规则；一次回查仍缺证据即结案，不挂待拍板。"
    confirmed: "此前不乘4的概括与老板表已证样例冲突，以上述有界目录规则修正；不把金标准逐单数量写死，不改变未证特殊单或全局取整"
  post_cap:
    name: "{颜色}立柱盖子"
    formula: "post_count - included_flat_caps"
    notes: "扣除原文明示四方大柱+平盖及已证40*60方管立柱支数；仅重算明确程序生成且等于旧总数的盖子，不覆盖手写数量"
  t_channel_kit:
    when: "T铝槽+挡板 斜撑 薄款"
    source_columns: "R5：明确黑色T斜撑且原文N支4米与数量列一致、配置只有黑色，先把支长移回配置并算米数，再用4米配套；冲突、厚款、缺长和混长不套用"
    per_piece:
      "4": {斜撑块: 20, 膨胀螺丝: 20, 顶丝: 20, 垫片: 10}
      "3": {斜撑块: 14, 垫片: 7}
    pending_decision: "3米膨胀/顶丝未明确；混合3/4米与已有金标准样例冲突，标待核不猜算；其它长度对照金标准回查"
  ground_channel_kit:
    when: "H960 / 127 / F108 铝槽，用户写配件配齐/全部配件带齐"
    rubber_per_meter: 2
    parts_per_meter: 2.5
    parts: [四方黑色塑料垫片, 三角压块, 膨胀螺丝]
    pending_decision: "非整数配件的取整方法由交付侧对照金标准回查；保留明确数量，不用公式覆盖"
    extra_lines: [ { b: "三角压块", c: "配顶丝 配玻璃压紧块" } ]

