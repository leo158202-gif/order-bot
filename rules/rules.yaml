# ---------- 3. 立柱类（PDF 第二节） ----------
# B 列 = 颜色 + 内卡槽立柱 + 款式；C 列 = 【壁厚】高度 槽型；D 列 = N支
# 多槽型必须分行：首行写 B 列，续行 B 列留空
posts:
  rules:
    - "B 列只写 颜色 + 类型 + 款式；壁厚、高度、槽型都写在 C 列"
    - "C 列组合：[槽口XX]【壁厚】高度 槽型 [其他]，例：槽口20【3.0】950高 单槽"
    - "壁厚 2.0 / 3.0 / 3.0厚 → 【2.0】/【3.0】放 C 列最前（有槽口时放槽口后面）"
    - "金标准样例登记映射：原文50*50*2.8立柱且为焊接无头或摇头时，C列壁厚登记【3.0】，保留原文2.8和转换记录；不推广到其它截面、款式或2.8米长度（10.20序36、10.21序42）"
    - "高度写法：960高、1200高、1米高、1.2米高，原文怎么写保留"
    - "原文明写40*60*2.0颜色立柱N支（X米）：B写40*60颜色铝合金立柱，C写【2.0】X米高；不是内卡槽立柱，不自动配普通立柱盖子。保留手写盖子；钻尾多日有反例，不据此推统一公式"
    - "金标准SKU映射：完整原文100*100*1.5灰色四方大柱+平盖N支且未另述高度，登记100*100*1.2米高，保留原始三段规格；不覆盖明确高度或其它SKU（10.21序42）"
    - "槽型：单槽 / 双槽 / 转角 / 三槽 / 无槽，每种槽型单独一行"
    - "同源组合映射（10.21序42）：灰色50*50*2.8立柱950高摇头款、离地20公分，配明确灰色40*60*2.0扶手，登记焊接扶手款并保留原款式；多规格扶手或其它立柱款式混配不套用，不推广所有摇头款"
    - "10.21序30已证：本条明确黑改灰、850高/2.0免扶手的组合登记焊接免扶手款，并带离地10公分焊接说明；仍不配钻尾。不推广其它高度或没有明确改色来源的免扶手款"
    - "“2双6单” → 两行：双槽 2支、单槽 6支"
    - "总高含卡条；离地默认 10 公分"
    - "原文写“只”保留“只”（如 2只），否则用“支”"
  mapping:
    - { short: ["免扶手款", "免扶手"], b: "{颜色}内卡槽立柱 免扶手款", style: mianfushou }
    - { short: ["H头", "H款"], b: "{颜色}内卡槽立柱 H款", style: h, note: "整柱默认带卡条锁螺丝说明；独立H头按r13_verified边界处理，不能展开整柱配件" }
    - { short: ["摇头"], b: "{颜色}内卡槽立柱 摇头款", style: yaotou, note: "配 36*88 扶手" }
    - { short: ["无头"], b: "{颜色}内卡槽立柱 无头", style: wutou, note: "焊接款无头" }
    - { short: ["平头"], b: "{颜色}内卡槽立柱 平头", style: pingtou }
    - { short: ["扶手款"], b: "{颜色}内卡槽立柱 扶手款", style: fushou, source: word }
    - { short: ["耳朵款"], b: "{颜色}内卡槽立柱 耳朵款", style: erduo, source: word }
    - { short: ["焊接"], b: "{颜色}内卡槽立柱 焊接款", note: "焊接工艺；与款式组合时写成 焊接 H款 / 焊接 免扶手款 / 焊接款 无头（见订单表）" }
    - { short: ["大柱", "100*100", "四方大柱"], b: "{颜色}铝合金四方大柱+平盖", c: "100*100*高度", style: dazhu }
    - { short: ["垫高条"], b: "{颜色}立柱垫高条", c: "10公分", source: word }
  slot_words:
