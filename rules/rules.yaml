    - "30*30 壁厚 1.2：一般C列最前写【1.2】；R12b多日金标已证黑色整支款B写30*30黑色铝合金卡槽扶手【1.2】，C只留支长，须原文/配置/米数一致；不据此猜改长度或其它颜色"
    - "40*40 卡槽扶手必须在 C 列标注槽口 16/18/20"
    - "原文有“新”或“新款”时，B 列加“新款”前缀"
    - "扶手长度单位：原文写“只”保留“只”，否则用“支”"
    - "独立灯带条原文为无支数的纯米数加号表达（如1.5➕1米），与现配置各段一致时按各1支列出并合计；相同长度合并支数，原文和原配置保留；有明确支数、其它单位或说明不套用（10.22序2）"
