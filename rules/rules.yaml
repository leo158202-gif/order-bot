# R27：动作写回唯一原单，不能生成新的序号订单。运行副本本轮不热更新。
order_amendments:
  replace: "修改后为完整替代版本；更新唯一同群原单，保留原日期、序号与来源，不新建订单"
  merge: "颜色确认、收货/物流/备注补充合入原单；多色或多候选不猜归属"
  void: "取消/取消说明标记原单已取消，清除表上商品数量，不生成取消说明商品行"
  identity: "完整同群引用链优先；无引用须完整电话含分机、姓名和地址全部对应且候选唯一；不按最近单/电话单独合并"
  safety: "未能唯一绑定、冻结批次、原写入凭据或回读冲突均停止并保留来源待核，不降级为新单；普通新订单照常追加"

# ---------- 1. 文本归一（程序确定性执行） ----------
normalize:
  symbols:
    - { from: ["x", "X", "×", "＊"], to: "*", scope: "规格中的乘号，如 30x30 → 30*30" }
    - { from: ["【", "】"], keep: true, note: "壁厚用方头括号【2.0】" }
  typos:
    "立住": "立柱"
    "免护手": "免扶手"
    "三曹": "三槽"
  colors:
    # PDF 第五节：同义词统一
    - { aliases: ["砂黑", "磨砂黑", "亚黑", "黑色", "黑"], standard: "黑色" }
    - { aliases: ["砂灰", "深灰", "灰色", "灰"], standard: "灰色" }
    - { aliases: ["咖啡", "咖啡色"], standard: "咖啡色" }
    - { aliases: ["肌肤黑"], standard: "肌肤黑" }
    - { aliases: ["金属灰"], standard: "金属灰" }
    - { aliases: ["香槟金"], standard: "香槟金" }
    - { aliases: ["白色", "白"], standard: "白色", note: "PDF 未列，订单表中出现过" }
  color_todo_confirm: >
    旧重复询问已作废：砂黑/磨砂黑按已定normalize.colors归一黑色；
    其它表面工艺或不同原文颜色不据此猜改，发生实际差异由交付侧对照老板表回查。
  default_color: null   # 原文没说颜色时不猜，进待确认（扶手“颜色看上下文”时可取同单其他产品颜色）
  literal_attributes:
    - "原文明写拉丝黑时保留表面工艺，B写拉丝黑、配件C写拉丝黑色；不归成普通黑色，不在混色同规格配件间借色"
    - "原文明写弯弧时保留加工要求；无壁厚不能保留模型臆造的3.5/厚款，枪灰不自动换成老款拉丝灰"
    - "侧装原文只有220/400/460高而未写230型号时，不默认230；保留原高度。配件原文m/米不能暗改为个，单位未证留白话核查"

