    - { short: "20 3.5 黑色", b: "20*20黑色铝合金卡槽扶手 厚款", c: "【3.5】X支X米", note: "20规格壁厚移到C；2.5/3.5保留原值，黑/灰20*20*3.0完整整支原文与配置一致时按R11已证目录登记2.5；不扩大到其它颜色或否定/修改" }
